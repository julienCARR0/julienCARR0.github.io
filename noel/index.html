<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liste de Noël · Julien</title>
<meta name="description" content="Ma liste de Noël 2026, dévoilée par le Père Noël.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1230">
<meta property="og:title" content="Liste de Noël · Julien">
<meta property="og:description" content="Lance la fête : le Père Noël dévoile ma liste, cadeau après cadeau.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='25' text-anchor='middle' font-size='24'%3E🎁%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap">
<style>
  :root {
    --bg: #0b0b0c;
    --card: #141416;
    --line: #26262a;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #e5484d;
    --gold: #f3c04f;
    --panel: 420px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b1230; color: var(--text); line-height: 1.5; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Scène 3D ---------- */
  #stage { position: fixed; inset: 0; transition: right .9s var(--ease), bottom .9s var(--ease); }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }
  .started #stage { right: var(--panel); }

  .pill {
    position: absolute; left: 16px; top: 16px; z-index: 2;
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(10,12,28,.72); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 999px; padding: 8px 14px 8px 10px; font-size: 14px; font-weight: 500;
    opacity: 0; transform: translateY(-8px); transition: opacity .5s, transform .5s;
  }
  .started .pill.on { opacity: 1; transform: none; }
  .ring { width: 26px; height: 26px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3.5; }
  .ring .bg { stroke: rgba(255,255,255,.15); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .2s linear; }

  /* ---------- Écran d'accueil ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 40%, rgba(6,9,26,.25), rgba(6,9,26,.88) 75%);
    transition: opacity .8s ease, visibility .8s;
  }
  .started #splash { opacity: 0; visibility: hidden; }
  .tag {
    display: inline-flex; gap: 8px; font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
    color: #c7cbe0; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px;
    background: rgba(255,255,255,.04);
  }
  .tag b { color: var(--accent); font-weight: 650; }
  #splash h1 {
    font-size: clamp(44px, 9vw, 92px); font-weight: 780; letter-spacing: -.04em; line-height: 1;
    margin: 22px 0 16px; text-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #splash h1 span { color: var(--accent); }
  #splash p { color: #c7cbe0; font-size: clamp(15px, 2vw, 18px); max-width: 460px; margin: 0 auto 30px; }
  .open {
    font: inherit; font-size: 19px; font-weight: 700; cursor: pointer; color: #fff;
    background: var(--accent); border: 0; border-radius: 999px; padding: 18px 34px;
    box-shadow: 0 14px 50px -10px rgba(229,72,77,.8), inset 0 -3px 0 rgba(0,0,0,.15);
    animation: pulse 1.8s ease-in-out infinite; transition: background .2s;
  }
  .open:hover { background: #f2555a; }
  .open:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .sound { display: block; margin-top: 16px; font-size: 13px; color: #8f94b0; }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  /* ---------- Panneau de la liste ---------- */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel); z-index: 5;
    background: rgba(13,13,16,.97); border-left: 1px solid var(--line);
    overflow-y: auto; overscroll-behavior: contain; padding: 26px 20px 40px;
    transform: translateX(105%); transition: transform .9s var(--ease) .1s;
  }
  .started #panel { transform: none; }
  .phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .phead h2 { font-size: 26px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
  .phead h2 span { color: var(--accent); }
  .progress { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .bar { height: 4px; background: #232329; border-radius: 4px; overflow: hidden; margin: 14px 0 22px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .8s var(--ease); }
  .iconbtn {
    font: inherit; font-size: 15px; cursor: pointer; color: var(--text); background: #1c1c21;
    border: 1px solid var(--line); border-radius: 10px; width: 40px; height: 40px; flex: none;
  }
  .iconbtn:hover { border-color: #52525b; }

  .slots { display: grid; gap: 16px; }
  .slot { position: relative; }

  .mystery {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    border: 1px dashed #34343c; border-radius: 16px; background: #111114;
  }
  .mystery .gift { font-size: 30px; width: 54px; height: 54px; display: grid; place-items: center; background: #1a1a1f; border-radius: 12px; flex: none; }
  .slot.next .mystery { border-color: rgba(229,72,77,.5); background: rgba(229,72,77,.06); }
  .slot.next .mystery .gift { animation: shake 1.2s ease-in-out infinite; }
  .mystery b { display: block; font-size: 15px; }
  .mystery span { color: var(--muted); font-size: 13px; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    animation: reveal .9s var(--ease) both;
  }
  @keyframes reveal {
    0% { transform: scale(.6) rotate(-4deg); opacity: 0; box-shadow: 0 0 0 0 rgba(243,192,79,.0); }
    55% { transform: scale(1.04) rotate(1deg); opacity: 1; box-shadow: 0 0 0 6px rgba(243,192,79,.35); }
    100% { transform: none; box-shadow: 0 0 0 0 rgba(243,192,79,0); }
  }
  .media { position: relative; height: 180px; background: #fff; display: grid; place-items: center; }
  .media img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }
  .media .fallback { display: none; font-size: 56px; }
  .media.noimg { background: linear-gradient(135deg, #1c1c20, #111113); }
  .media.noimg .fallback { display: block; }
  .num, .badge {
    position: absolute; top: 12px; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 4px 10px;
  }
  .num { left: 12px; background: #0b0b0c; color: var(--text); }
  .badge { right: 12px; background: var(--accent); color: #fff; }
  .body { padding: 18px; display: grid; gap: 10px; }
  .brand { font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card h3 { font-size: 19px; font-weight: 680; letter-spacing: -.02em; line-height: 1.25; }
  .desc { color: #d4d4d8; font-size: 14px; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
  .specs li { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; }
  .note { font-size: 13px; background: rgba(243,192,79,.07); border: 1px solid rgba(243,192,79,.28); border-radius: 9px; padding: 8px 10px; }
  .note strong { color: var(--gold); }
  .price { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
  .price s { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .price small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .shops { list-style: none; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .shops li + li { border-top: 1px solid var(--line); }
  .shops a {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 13px; color: var(--text); text-decoration: none; font-size: 14px; transition: background .2s;
  }
  .shops a:hover { background: #1d1d22; }
  .shops .shop { font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .shops .best { font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 6px; padding: 2px 6px; }
  .shops .meta { color: var(--muted); font-size: 12px; }
  .shops .p { font-weight: 700; white-space: nowrap; }
  .shops .go { color: var(--muted); }

  .done {
    display: none; text-align: center; padding: 18px; border-radius: 16px; margin-top: 16px;
    background: linear-gradient(135deg, rgba(229,72,77,.14), rgba(243,192,79,.12)); border: 1px solid rgba(243,192,79,.3);
    font-weight: 600; animation: reveal .9s var(--ease) both;
  }
  .all .done { display: block; }

  .now { margin-top: 26px; }
  .now h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .now iframe { display: block; width: 100%; height: 212px; border: 0; border-radius: 12px; background: #000; }
  .pfoot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--muted); }
  .pfoot a { color: var(--text); }

  /* Cadeau volant + confettis */
  .flyer { position: fixed; left: 0; top: 0; z-index: 40; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none; }
  .flash {
    position: fixed; inset: 0; z-index: 35; pointer-events: none;
    background: radial-gradient(circle at var(--x) var(--y), rgba(255,240,200,.75), rgba(255,240,200,0) 40%);
    animation: flash .6s ease-out forwards;
  }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .confetti { position: fixed; z-index: 41; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; }

  @media (max-width: 820px) {
    :root { --sheet: 48svh; }
    .started #stage { right: 0; bottom: var(--sheet); }
    #panel {
      top: auto; left: 0; width: auto; height: var(--sheet);
      border-left: 0; border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
      transform: translateY(105%); padding: 20px 16px 36px;
    }
    .phead h2 { font-size: 22px; }
    .media { height: 160px; }
  }
</style>
</head>
<body>

<div id="stage" aria-hidden="true">
  <div class="pill" id="pill">
    <svg class="ring" viewBox="0 0 30 30"><circle class="bg" cx="15" cy="15" r="12"/><circle class="fg" id="ringfg" cx="15" cy="15" r="12" stroke-dasharray="75.4" stroke-dashoffset="75.4"/></svg>
    <span id="pilltext">Prochain cadeau…</span>
  </div>
</div>

<div id="splash">
  <div>
    <span class="tag">🎄 <b>Noël 2026</b> · Julien</span>
    <h1>Ma liste de <span>Noël</span></h1>
    <p>Le Père Noël et ses rennes vont te dévoiler ma liste, cadeau après cadeau.</p>
    <button class="open" id="open" type="button">🎁 Lancer la fête</button>
    <span class="sound">Monte le son 🔊</span>
  </div>
</div>

<aside id="panel" aria-label="Ma liste de Noël">
  <div class="phead">
    <div>
      <h2>Ma liste de <span>Noël</span></h2>
      <p class="progress" id="progress">0 cadeau dévoilé</p>
    </div>
    <button class="iconbtn" id="toggle" type="button" aria-label="Pause">⏸</button>
  </div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="slots" id="slots"></div>
  <div class="done">🎉 Toute la liste est dévoilée. Merci d'avance !</div>
  <section class="now">
    <h4>🎶 Los Peces en el Río · Efecto SR</h4>
    <div id="yt"></div>
  </section>
  <p class="pfoot"><a href="/">juliencarr0.github.io</a></p>
</aside>

<script type="module">
import * as THREE from './vendor/three.min.js';

/* =========================================================
   La liste (n'apparaît qu'une fois lancée par le Père Noël)
   ========================================================= */
const ARROW = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11 11 5M6 5h5v5"/></svg>';
const ITEMS = [
  {
    color: '#d1182f', ribbon: '#f3c04f', emoji: '🖥️',
    img: 'https://media.ldlc.com/r1600/ld/products/00/05/79/00/LD0005790095_1_0005806467_0006017073.jpg',
    brand: 'Samsung', name: 'Écran PC Odyssey G5 G55T 34″', badge: 'Black Friday −23 %',
    desc: 'Écran ultra-large incurvé, très fluide, idéal pour le sim racing et le travail.',
    specs: ['34″ incurvé 1000R', '3440 × 1440', '165 Hz', '1 ms', 'FreeSync Premium'],
    note: '<strong>Référence exacte :</strong> LC34G55TWWPXEN (34 pouces)',
    price: '229,99 €', old: '299,99 €', priceNote: 'offre Black Friday · prix relevés le 24/11/2026',
    shops: [
      { name: 'Fnac', best: true, p: '229,99 €', meta: 'livraison offerte', url: 'https://www.fnac.com/SearchResult/ResultList.aspx?Search=LC34G55TWWPXEN' },
      { name: 'Cdiscount', p: '229,99 €', meta: '+ 4,99 € livraison', url: 'https://www.cdiscount.com/search/10/lc34g55twwpxen.html' },
      { name: 'Darty', p: '229,99 €', meta: '+ 7,99 € livraison', url: 'https://www.darty.com/nav/achat/informatique/accessoire_bureau/ecran_plat/samsung_odyssey_g5_-_g55t.html' }
    ]
  },
  {
    color: '#2563eb', ribbon: '#f4f4f5', emoji: '🏎️',
    img: 'https://cdn.shopify.com/s/files/1/0591/1216/1363/files/podium-advanced-paddle-module-8486108.jpg?v=1784986884',
    brand: 'Simube', name: 'Podium Advanced Paddle Module', badge: 'Promo −15 %',
    desc: 'Module de palettes pour mon volant Fanatec : aluminium usiné, palettes en carbone, capteurs à effet Hall.',
    specs: ['Aluminium CNC', 'Carbone 3 mm', 'Shifters magnétiques', 'Compatible Fanatec'],
    note: '<strong>Couleur :</strong> noir (Black), déjà sélectionnée via le lien',
    price: '≈ 73 €', old: '≈ 86 €', priceNote: 'soldé à 84,15 $ au lieu de 99 $ · livraison et douane incluses',
    shops: [
      { name: 'Simube', best: true, p: '84,15 $', meta: '≈ 73 €', url: 'https://simube.com/products/podium-advanced-paddle-module?variant=43324694528083' }
    ]
  },
  {
    color: '#16a34a', ribbon: '#f3c04f', emoji: '📷',
    img: 'https://cdn.shopify.com/s/files/1/2986/1172/files/capture003_38124114342_o2.jpg?v=1762275887&width=1024&height=1024&crop=center',
    brand: 'Peak Design', name: 'Capture Camera Clip', badge: 'Promo −20 %',
    desc: 'Clip en aluminium pour accrocher un appareil photo sur une bretelle de sac ou une ceinture.',
    specs: ['Aluminium usiné', 'Supporte 90 kg', 'Garantie à vie'],
    note: '<strong>Couleur :</strong> argent (Silver), déjà sélectionnée via le lien',
    price: '63,99 €', old: '79,99 €', priceNote: 'sur le site officiel · prix relevé le 24/11/2026',
    shops: [
      { name: 'Peak Design', best: true, p: '63,99 €', meta: 'site officiel', url: 'https://www.peakdesign.com/eu/products/capture?Color=Silver' }
    ]
  }
];

const slotsEl = document.getElementById('slots');
ITEMS.forEach((it, i) => {
  const s = document.createElement('div');
  s.className = 'slot' + (i === 0 ? ' next' : '');
  s.innerHTML = '<div class="mystery"><div class="gift">🎁</div><div><b>Cadeau n°' + (i + 1) + '</b><span class="when">Le Père Noël le cherche dans sa hotte…</span></div></div>';
  slotsEl.appendChild(s);
});

function cardHTML(it, i) {
  const shops = '<ul class="shops">' + it.shops.map(s =>
    '<li><a href="' + s.url + '" target="_blank" rel="noopener"><span class="shop">' + s.name +
    (s.best && it.shops.length > 1 ? ' <span class="best">Meilleur prix</span>' : '') +
    '</span><span><span class="p">' + s.p + '</span> <span class="meta">· ' + s.meta + '</span> <span class="go">' + ARROW + '</span></span></a></li>').join('') + '</ul>';
  return '<article class="card">' +
    '<div class="media"><span class="num">0' + (i + 1) + '</span><span class="badge">' + it.badge + '</span>' +
    '<img src="' + it.img + '" alt="' + it.name + '" referrerpolicy="no-referrer"><span class="fallback">' + it.emoji + '</span></div>' +
    '<div class="body"><span class="brand">' + it.brand + '</span><h3>' + it.name + '</h3>' +
    '<p class="desc">' + it.desc + '</p>' +
    '<ul class="specs">' + it.specs.map(s => '<li>' + s + '</li>').join('') + '</ul>' +
    '<p class="note">' + it.note + '</p>' +
    '<div class="price">' + it.price + '<s>' + it.old + '</s><small>' + it.priceNote + '</small></div>' +
    shops + '</div></article>';
}

let revealedCount = 0;
function revealSlot(i) {
  const slot = slotsEl.children[i];
  slot.classList.remove('next');
  slot.innerHTML = cardHTML(ITEMS[i], i);
  const img = slot.querySelector('img');
  const fail = () => { img.parentElement.classList.add('noimg'); img.remove(); };
  img.addEventListener('error', fail);
  revealedCount++;
  if (slotsEl.children[i + 1]) slotsEl.children[i + 1].classList.add('next');
  document.getElementById('progress').textContent =
    revealedCount + ' / ' + ITEMS.length + ' cadeau' + (revealedCount > 1 ? 'x' : '') + ' dévoilé' + (revealedCount > 1 ? 's' : '');
  document.getElementById('barfill').style.width = (revealedCount / ITEMS.length * 100) + '%';
  if (revealedCount === ITEMS.length) document.getElementById('panel').classList.add('all');
  confetti(slot.getBoundingClientRect());
}

function giftSVG(c, r) {
  return '<svg viewBox="0 0 64 64" width="64" height="64"><rect x="8" y="24" width="48" height="34" rx="4" fill="' + c + '"/>' +
    '<rect x="4" y="16" width="56" height="12" rx="3" fill="' + c + '" style="filter:brightness(1.15)"/>' +
    '<rect x="28" y="16" width="8" height="42" fill="' + r + '"/>' +
    '<path d="M32 16 C22 2 10 8 20 16 Z M32 16 C42 2 54 8 44 16 Z" fill="' + r + '"/></svg>';
}

function flyToSlot(i, x, y) {
  const flash = document.createElement('div');
  flash.className = 'flash'; flash.style.setProperty('--x', x + 'px'); flash.style.setProperty('--y', y + 'px');
  document.body.appendChild(flash); setTimeout(() => flash.remove(), 700);

  const slot = slotsEl.children[i];
  slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const f = document.createElement('div');
  f.className = 'flyer'; f.innerHTML = giftSVG(ITEMS[i].color, ITEMS[i].ribbon);
  document.body.appendChild(f);
  setTimeout(() => {
    const r = slot.getBoundingClientRect();
    const tx = r.left + 43, ty = r.top + 43;
    const a = f.animate([
      { transform: `translate(${x}px, ${y}px) scale(2.4) rotate(0deg)` },
      { transform: `translate(${(x + tx) / 2}px, ${Math.min(y, ty) - 80}px) scale(1.6) rotate(200deg)`, offset: .5 },
      { transform: `translate(${tx}px, ${ty}px) scale(.9) rotate(380deg)` }
    ], { duration: 850, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
    a.onfinish = () => { f.remove(); revealSlot(i); };
  }, 120);
}

function confetti(rect) {
  const colors = ['#e5484d', '#f3c04f', '#22c55e', '#3b82f6', '#ffffff', '#f472b6'];
  const cx = rect.left + rect.width / 2, cy = rect.top + Math.min(rect.height, 240) / 2;
  for (let k = 0; k < 46; k++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.background = colors[k % colors.length];
    c.style.left = cx + 'px'; c.style.top = cy + 'px';
    document.body.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 160;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 60;
    c.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 140}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
    ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).onfinish = () => c.remove();
  }
}

/* =========================================================
   Scène 3D
   ========================================================= */
const params = new URLSearchParams(location.search);
const SPEED = Number(params.get('speed')) || 1;     // pour tester : ?speed=3
const SKIP = Number(params.get('skip')) || 0;       // pour tester : ?skip=10
const BEAT = 0.6;                                   // durée d'un temps (s) : à ajuster sur la musique
const DANCE_AT = 3.4;                               // début de la danse
const FIRST_THROW = 9;                              // premier cadeau
const THROW_EVERY = 15;                             // puis toutes les 15 s
const THROW_LEN = 4.4;
const RELEASE = 2.5, FLIGHT = 1.0;

const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

    const e = ease(clamp01((u - 3.1) / 1.0)); pos = S_SACK.clone().lerp(S_STAGE, e);
    p.ry = .3 * Math.sin(Math.PI * e); p.bob = .2 * hop; p.aLz = p.aRz = lerp(.4, 2.2, e);
    p.legL = hop; p.legR = 1 - hop;
  }
  p.x = pos.x; p.y = 0; p.z = pos.z;
  return p;
}
function applySanta(p) {
  const u = santa.userData;
  santa.position.set(p.x, p.y, p.z);
  santa.rotation.y = p.ry;
  u.flip.rotation.x = p.flip;
  u.bob.position.y = p.bob;
  u.torso.rotation.set(p.torsoX, 0, p.torsoZ);
  u.head.rotation.z = p.headZ;
  u.belly.scale.set(1 + p.belly, 1 - p.belly, 1 + p.belly);
  u.arms[0].rotation.set(p.aLx, 0, -p.aLz);
  u.arms[1].rotation.set(p.aRx, 0, p.aRz);
  u.legs[0].rotation.x = -.5 * p.legL; u.legs[0].position.y = .56 + .05 * p.legL;
  u.legs[1].rotation.x = -.5 * p.legR; u.legs[1].position.y = .56 + .05 * p.legR;
}

/* ---------- Caméra & taille ---------- */
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const narrow = camera.aspect < 1.1;
  look.set(narrow ? -1.0 : -1.45, narrow ? 1.75 : 1.55, .4);
  camera.userData.up = narrow ? -.15 : .75;
  const halfW = narrow ? 3.9 : 5.0, halfH = narrow ? 1.6 : 1.9;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.userData.dist = Math.max(halfH / t, halfW / (t * camera.aspect), 6.5);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);
resize();

/* ---------- Boucle ---------- */
let started = false, running = false, T = 0, idle = 0;
const thrown = ITEMS.map(() => false);
const clock = new THREE.Clock();
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), camTarget = new THREE.Vector3();
const pill = document.getElementById('pill'), pillText = document.getElementById('pilltext'), ringFg = document.getElementById('ringfg');
let lastUI = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  idle += dt;
  if (started && running) T += dt * SPEED;

  // neige
  for (let i = 0; i < SNOW_N; i++) {
    let y = snowPos[i * 3 + 1] - snowVel[i] * dt;
    snowPos[i * 3] += Math.sin(idle * .8 + i) * dt * .15;
    if (y < 0) y += 12;
    snowPos[i * 3 + 1] = y;
  }
  snowGeo.attributes.position.needsUpdate = true;

  const danceW = clamp01((T - DANCE_AT) / .6);
  const b = Math.max(0, T - DANCE_AT) / BEAT;
  const st = bachata(b);
  const cycle = Math.floor(b / 8);
  const spin = (cycle % 2 === 1 && st.c >= 4) ? Math.PI * 2 * ease((st.c - 4) / 4) : 0;

  // rênes
  reinMat.opacity = 1 - clamp01((T - .4) / .5);
  reins.forEach(r => r.visible = reinMat.opacity > .01);

  // rennes
  herd.forEach((r, i) => {
    const u = r.userData, d = .8 + .3 * i;
    const s = T > d ? easeOutBack(clamp01((T - d) / .9)) : 0;
    const turn = ease(clamp01((T - d - .5) / .8));
    u.torso.rotation.x = 1.4 * (1 - s);
    u.neck.rotation.x = -1.25 * (1 - s);
    u.bob.position.y = .012 * Math.sin(idle * 2.2 + i) + danceW * .07 * Math.abs(Math.sin(Math.PI * b));
    u.torso.rotation.z = danceW * (.12 * Math.sin(Math.PI * b) + .25 * st.tap);
    u.neck.rotation.z = danceW * .2 * Math.sin(Math.PI * b + .5);
    u.neck.rotation.y = (1 - s) * .15 * Math.sin(idle * .9 + i * 2);
    u.legs.forEach((l, k) => { l.rotation.x = -danceW * .5 * ((st.seg % 2 === k) ? Math.sin(Math.PI * st.f) : 0); });
    u.arms.forEach((a, k) => {
      const sx = k === 0 ? -1 : 1;
      a.rotation.x = -1.4 * (1 - s) + danceW * .25 * Math.sin(Math.PI * b + k);
      a.rotation.z = sx * danceW * (2.35 + .35 * Math.sin(2 * Math.PI * b + k * Math.PI + i));
    });
    r.position.x = HERD_X[i] + danceW * st.x;
    r.rotation.y = Math.PI / 2 * (1 - turn) + danceW * spin;
  });

  // Père Noël
  let pose;
  if (T < 1.9) {
    pose = { x: S_SLEIGH.x, y: S_SLEIGH.y, z: S_SLEIGH.z, ry: Math.PI / 2 - .5 * clamp01(T / .5), flip: 0, torsoX: 0, torsoZ: .05 * Math.sin(idle * 2),
      headZ: .08 * Math.sin(idle * 1.5), aLx: 0, aLz: .25, aRx: 0, aRz: 2.5 + .35 * Math.sin(idle * 7), legL: 0, legR: 0, bob: .01 * Math.sin(idle * 2), belly: .02 * Math.sin(idle * 2.5) };
  } else if (T < 3.0) {
    const p = (T - 1.9) / 1.1, e = ease(p);
    pose = { x: lerp(S_SLEIGH.x, S_STAGE.x, e), y: lerp(S_SLEIGH.y, 0, e) + 2.0 * Math.sin(Math.PI * p), z: lerp(S_SLEIGH.z, S_STAGE.z, e),
      ry: lerp(Math.PI / 2 - .5, 0, e), flip: -Math.PI * 2 * ease(clamp01((p - .1) / .75)), torsoX: 0, torsoZ: 0, headZ: 0,
      aLx: 0, aLz: 2.8, aRx: 0, aRz: 2.8, legL: Math.sin(Math.PI * p), legR: Math.sin(Math.PI * p), bob: 0, belly: .08 * Math.sin(p * 20) };
  } else {
    const dp = dancePose(b, spin * .5);
    pose = lerpPose({ ...dp, aLz: 2.8, aRz: 2.8, legL: 0, legR: 0 }, dp, danceW);
    for (let k = 0; k < ITEMS.length; k++) {
      const t0 = FIRST_THROW + k * THROW_EVERY, u = T - t0;
      if (u >= 0 && u < THROW_LEN) {
        const tp = throwPose(u, b);
        const w = Math.min(clamp01(u / .25), clamp01((THROW_LEN - u) / .35));
        pose = lerpPose(dp, tp, u < 2 ? clamp01(u / .25) : (u > THROW_LEN - .35 ? w : 1));
      }
    }
  }
  applySanta(pose);
  santa.updateMatrixWorld(true);

  // cadeaux
  for (let k = 0; k < ITEMS.length; k++) {
    const g = gifts[k], t0 = FIRST_THROW + k * THROW_EVERY, u = T - t0;
    if (u < 1.35 || thrown[k]) { g.visible = false; continue; }
    const ua = santa.userData.arms;
    ua[0].children[2].getWorldPosition(tmpA); ua[1].children[2].getWorldPosition(tmpB);
    const hands = tmpA.add(tmpB).multiplyScalar(.5);
    g.visible = true;
    if (u < RELEASE) {
      const e = ease(clamp01((u - 1.35) / .4));
      g.scale.setScalar(lerp(.2, 1, e));
      g.position.copy(SACK).lerp(hands.add(new THREE.Vector3(0, .2, 0)), e);
      g.rotation.set(0, u * 2, 0);
      g.userData.from = g.position.clone();
    } else {
      const p = clamp01((u - RELEASE) / FLIGHT), e = p * p * (3 - 2 * p);
      const to = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1.4)).add(new THREE.Vector3(.35, -.15, 0));
      g.position.copy(g.userData.from).lerp(to, e);
      g.position.y += Math.sin(Math.PI * p) * 1.6;
      g.rotation.set(p * 7, p * 9, p * 3);
      g.scale.setScalar(1 + p * .3);
      if (p >= 1) {
        thrown[k] = true; g.visible = false;
        const v = g.position.clone().project(camera), r = renderer.domElement.getBoundingClientRect();
        flyToSlot(k, r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height);
      }
    }
  }

  // caméra : léger mouvement vivant
  const dist = camera.userData.dist || 9;
  const sway = Math.sin(idle * .25) * .35;
  camTarget.set(look.x + sway, look.y + (camera.userData.up || .75) + Math.sin(idle * .3) * .1, look.z + dist);
  camera.position.lerp(camTarget, started ? 1 - Math.exp(-dt * 2.2) : 1);
  camera.lookAt(look);

  // compte à rebours
  if (started && idle - lastUI > .2) {
    lastUI = idle;
    const k = thrown.indexOf(false);
    if (k === -1) pill.classList.remove('on');
    else {
      const arrive = FIRST_THROW + k * THROW_EVERY + RELEASE + FLIGHT;
      const left = Math.max(0, arrive - T);
      const total = k === 0 ? arrive : THROW_EVERY;
      pill.classList.add('on');
      pillText.textContent = left > 3.6 ? 'Prochain cadeau dans ' + Math.ceil(left) + ' s' : '🎅 Il fouille dans sa hotte…';
      ringFg.style.strokeDashoffset = (75.4 * clamp01(left / total)).toFixed(1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =========================================================
   Musique + lancement
   ========================================================= */
const VIDEO = 'i3-uvps5pRc';
const toggle = document.getElementById('toggle');
let player = null, ready = false, wantPlay = false;

function startShow() {
  if (started) return;
  started = true; running = true; T = SKIP;
  document.body.classList.add('started');
  document.getElementById('open').blur();
}
function setPlaying(on) {
  running = on;
  toggle.textContent = on ? '⏸' : '▶';
  toggle.setAttribute('aria-label', on ? 'Pause' : 'Lecture');
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    width: '100%', height: 212, videoId: VIDEO,
    playerVars: { playsinline: 1, rel: 0, loop: 1, playlist: VIDEO },
    events: {
      onReady: () => { ready = true; if (wantPlay) { player.unMute(); player.playVideo(); } },
      onStateChange: e => {
        if (e.data === 1) { startShow(); setPlaying(true); }
        if (e.data === 2) setPlaying(false);
      }
    }
  });
};
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

document.getElementById('open').addEventListener('click', () => {
  if (ready && player) { player.unMute(); player.playVideo(); } else wantPlay = true;
  // on attend que la musique démarre ; si YouTube est bloqué, la fête démarre quand même
  setTimeout(startShow, 1800);
});
toggle.addEventListener('click', () => {
  if (player && ready && player.getPlayerState) {
    if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
  } else setPlaying(!running);
});
</script>
